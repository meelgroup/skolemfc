name: Build and Test

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: release (linux)
            os: ubuntu-24.04
            cmake_args: -DCMAKE_BUILD_TYPE=Release
            run_tests: true

          # - name: debug-ubsan (linux)
          #   os: ubuntu-24.04
          #   cmake_args: >-
          #     -DCMAKE_BUILD_TYPE=Debug
          #     -DCMAKE_CXX_FLAGS="-fsanitize=undefined,address -fno-sanitize-recover=all"
          #     -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=undefined,address"
          #   run_tests: true

          - name: static (linux)
            os: ubuntu-24.04
            cmake_args: -DCMAKE_BUILD_TYPE=Release -DSTATICCOMPILE=ON
            run_tests: true

          - name: static (macos)
            os: macos-latest
            cmake_args: -DCMAKE_BUILD_TYPE=Release -DSTATICCOMPILE=ON
            run_tests: true

          - name: release (macos)
            os: macos-latest
            cmake_args: -DCMAKE_BUILD_TYPE=Release
            run_tests: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake libmlpack-dev libensmallen-dev \
            libgmp-dev libboost-all-dev libmpfr-dev \
            zlib1g-dev \
            libubsan1 libasan8

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake mlpack gmp boost mpfr
          echo "CMAKE_PREFIX_PATH=$(brew --prefix)" >> $GITHUB_ENV

      - name: Cache built deps
        uses: actions/cache@v4
        with:
          path: build/deps_install
          key: deps-${{ matrix.name }}-${{ hashFiles('deps/**/*.txt', 'deps/**/*.cmake', 'deps/**/CMakeLists.txt') }}
          restore-keys: |
            deps-${{ matrix.name }}-${{ runner.os }}-

      - name: Configure
        run: |
          cmake -S . -B build \
            -DAUTO_DOWNLOAD=OFF \
            ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --parallel $(nproc 2>/dev/null || sysctl -n hw.logicalcpu)

      - name: Version check
        run: build/skolemfc --version

      - name: Test — find_inv_bvsle_bvnot_4bit
        if: matrix.run_tests
        run: |
          build/skolemfc -s 1 -e 0.8 -d 0.8 \
            utils/baseline/find_inv_bvsle_bvnot_4bit.qdimacs 2>&1 | tee /tmp/out.txt
          grep -q "^s fc 2 \*\*" /tmp/out.txt
